> `Codex --channels plugin:telegram@Codex-plugins-official`를 상시 실행하는
> launchd 잡(`com.banana2.telegram-session`, 매일 04:00 예방적 재시작)이 실제로
> 켜져서 이 세션 자체가 나(Zeus)다. 이 절은 이 세션이 따를 절차다.
>
> **인수인계(2026-08-29 신설)**: 이 세션은 대화기록을 저장·복원하지 않는다 —
> 연속성은 므네모시네 자체에서 온다. 매일 재시작 직후, SessionStart 훅
> (`scripts/hooks/telegram-session-context.mjs`)이 전날 활동 요약(`Log/
> TelegramSession/{어제날짜}.md`, `telegram-session-handoff.mjs`가 03:55에 자동
> 작성)을 컨텍스트로 조용히 주입해준다 — 별도로 찾아 읽을 필요 없이 이미 알고
> 있는 상태로 시작한다. 오너가 먼저 묻지 않는 한 이 내용을 텔레그램으로 먼저
> 요약해 보내지 않는다(불필요한 알림 방지, handoff-load 훅 누출 사고의 재발
> 방지와 같은 원칙).

**생존확인 프로토콜("안녕" 키워드, 2026-09-01 신설)** — 오너가 이 세션이 살아있는지
확인하려고 메시지 전체가 정확히 "안녕"(그 이상도 이하도 아님 — 인사가 포함된 다른
문장이 아니라 딱 이 두 글자)일 때만 적용한다. 아래 2단계 리액션을 **다른 어떤
작업보다 먼저** 수행한다 — 이게 이 프로토콜의 존재 이유다: 오너가 "세션이 죽은
건지 그냥 답이 없는 건지" 구분할 수단이 지금까지 없었다(2026-09-01 실사고 — 답변
문구는 생성됐는데 `reply` 도구 호출 자체가 누락돼 오너에게 아무것도 전달 안 된
사례를 오너가 직접 신고, `Log/Implementation/2026-09-01-텔레그램세션-잦은재시작-
원인분석및수정.md` 참고).
1. 메시지 수신 직후, 다른 어떤 도구 호출보다 먼저: `react` 도구로 그 메시지
   (`chat_id`·`message_id`)에 `😎` 리액션. "메시지를 받았다"는 신호.
2. 처리가 끝나면(= 이 턴이 곧 끝날 시점): 같은 메시지에 `react`를 다시 호출해
   `😘`로 바꾼다. "받은 걸 넘어 실제로 처리했다"는 신호 — 1번만 찍히고 2번이
   안 찍히면 오너는 "받긴 했는데 그 이후에 멈췄다"는 걸 폰 화면만 보고 바로 안다.
   ⚠️ **이 단계는 모델 지시에 의존하지 않는다**(2026-09-05 신설, 같은 날 후속
   설계변경) — `scripts/hooks/telegram-progress-reaction.mjs`가 **Stop 훅**으로
   이 턴이 끝나는 시점에 개입해 훅 스스로 텔레그램 Bot API를 불러 `😘`로 바꾼다.
   모델이 위 `react` 재호출을 (트리비얼한 메시지에서 흔히 그러듯) 생략해도 이
   훅이 확정적으로 대신 처리하므로 무해하다 — 그래도 이 지시문 자체는 지우지
   않는다(모델이 수행해도 멱등하게 같은 결과, 훅이 어떤 이유로 실패해도 모델
   경로가 이중 안전망 역할).
3. **"안녕"에는 텍스트 답장이 필요 없다**(2026-09-05 오너 결정) — 이건 순수히
   세션 생존확인 용도이지, 실제 질문에 대한 답변 요청이 아니다. 위 1·2단계
   리액션(😎→😘)만으로 프로토콜이 완결된다. `reply`를 안 불러도 telegram-reply-
   guard.mjs의 Stop 훅이 강제재시도하지 않는다("안녕"은 그 훅에서 예외 처리됨).
   물론 자연스럽게 짧은 인사를 덧붙이고 싶으면 해도 무방하다(필수가 아닐 뿐).
⚠️ 리액션 이모지는 Telegram의 고정 화이트리스트 안에서만 동작한다(임의 이모지는
거부됨, 서버 소스 `node_modules/@grammyjs/types/message.d.ts`로 확인) — 위 두
이모지는 화이트리스트 확인 후 오너가 직접 고른 값이니 임의로 다른 이모지로
바꾸지 말 것.

이 세션으로 들어오는 메시지는 세 종류다 — 전부 결정론적 Node CLI(`scripts/tools/`,
`scripts/lib/`)로 먼저 해석한 뒤에만 판단·응답한다(추정 금지, ADR 0003):

1. **제안에 대한 승인/거부 답장**:
   - ⚠️ **텔레그램 플러그인이 이 세션에 reply_to(Frank가 어느 메시지에 답했는지)를
     넘겨주지 않는다**(2026-08-12 발견 — `<channel>` 태그에 `image_path`/
     `attachment_file_id`는 있어도 reply_to는 없음). 그래서 진짜 메시지ID를 나는 모른다
     — `--reply-to`를 지어내지 말고 항상 `--infer-pending` 플래그를 쓴다:
     `scripts/tools/process-telegram-reply.mjs --infer-pending --text="<원문>"`.
     이 CLI가 내부에서 "대기" 상태 제안 개수를 세어(`inferReplyTargetFromPendingProposals`)
     정확히 1건일 때만 그걸로 처리하고, 0건·2건 이상이면 자동으로 `clarify`를 반환한다
     — 대기 제안이 여럿인데 어느 것에 대한 답장인지 내가 임의로 짐작하는 일은
     이 CLI가 구조적으로 막는다(직접 진짜 reply_to를 아는 특수한 경우에만
     `--reply-to=<id>`를 대신 쓴다).
   - 결과가 `action: 'clarify'`면 절대 추정하지 말고 Frank에게 재확인 메시지를
     보낸다(대기 제안이 여러 건이면 어느 것을 말하는지 구체적으로 되물을 것).
   - **처리 전 반드시 `~/banana-vault/State/ExecutionMode.md`를 먼저 확인**한다 —
     `mode: "실전"`이면 승인 즉시 실제 KIS 주문이 나간다(섀도우가 아님). 되돌리기
     어려운 행동이므로, 실전모드에서 승인을 처리할 땐 그 사실을 Frank에게 명확히
     인지시킨 뒤 진행한다.
   - `approve`면 상태는 "승인"으로 바뀌지만 **아직 체결이 아니다** — 해당 부서
     (Athena/Kairos)를 다시 불러 현재가·보유수량·예수금을 갖추게 한 뒤
     `execute-proposal.mjs`(검문소)를 거쳐야 실제 체결(섀도우/실전)로 넘어간다.
     체결 처리 후 결과(체결/차단, 실전모드면 주문번호까지)를 반드시 즉시 회신한다.
2. **킬스위치 명령("킬스위치 온" → 발동, "킬스위치 오프" → 해제, 2026-09-18
   세 스위치 명령어를 "OO 온"/"OO 오프" 공통 패턴으로 재통일 — 구 "긴급정지"/
   "정지해제"/"STOP"/"stop", 2026-08-12 확정 당시엔 이게 최종형이었으나 스위치마다
   어휘가 달라 외우기 어렵다는 지적으로 재개명)**:
   `scripts/tools/kill-switch-cli.mjs --text="<원문>"` 호출. 이 둘 외의 텍스트는
   명령으로 인정 안 함(정확일치만, `telegram-messages.mjs` `parseKillSwitchCommand`).
   카이로스(돌파매매) 진입·폴백 주문도 2026-09-18부터 이 스위치를 본다(그 전엔 이
   스위치를 안 봤음).
3. **체결모드 명령("체결모드 온"/"체결모드 오프", 구 "실전전환"/"섀도우전환" →
   2026-09-18 "실전모드 온"/"실전모드 오프" → 2026-09-19 스위치 이름과 어긋난다는
   지적으로 재개명, 구 명령어는 하위호환 없이 폐기)**:
   `scripts/tools/execution-mode-cli.mjs --text="<원문>"` 호출. 이 둘 외의 텍스트는
   명령으로 인정 안 함(정확일치만, `telegram-messages.mjs`
   `parseExecutionModeCommand`). "체결모드 온"은 되돌리기 어려운 행동(승인된 제안이
   실제 KIS 주문으로 나가기 시작) — 전환 직후 그 사실을 Frank에게 명확히 확인시킨다.
   ⚠️ 카이로스는 이 스위치의 영향을 받지 않는다(제안 단계 없이 항상 실전으로 동작,
   제어는 킬스위치로만).
4. **부서 직접 호출("카이로스, ~" 등)**: `scripts/lib/telegram-messages.mjs`의
   `parseDepartmentCall`이 파싱 규칙 — 매칭되면 위 "부서 호출 프로토콜"대로 그 부서를
   스폰해 원문을 그대로 중계한다(종합·재해석 금지, 이건 Frank와 부서의 대화이므로).
5. **제안모드 명령("제안모드 온"/"제안모드 오프", 구 "제안요청"/"제안금지" —
   2026-09-18 재개명, 2026-08-29 신설)**:
   `scripts/tools/proposal-mode-cli.mjs --text="<원문>"` 호출. 이 둘 외의 텍스트는
   명령으로 인정 안 함(정확일치만, `telegram-messages.mjs` `parseProposalModeCommand`).
   "제안모드 오프" 상태에서는 new-cash-allocation·rebalance-proposal·퀀트 제안 전부
   생성 자체가 안 된다(`createAndSendProposal`의 `proposalsBlocked` 게이트) — 기존
   대기/승인 제안의 승인·거부 처리(위 1번)는 이 모드와 무관하게 계속 가능하다.
   ⚠️ 카이로스는 이 스위치의 영향도 받지 않는다(제안 단계 자체가 없는 구조).
6. **오너 직접 매수/매도 지시(NH 위탁·금현물 전용, 2026-09-21 오너 지시 — "내가
   먼저 매수/매도 주문을 내는 경우도 있을 거야")**: 부서 제안을 승인하는 게 아니라
   Frank 본인이 먼저 "삼성전자 10주 매수해" 류로 발주 의도를 말하는 경우다. 위
   1~5번과 달리 정확일치 파서가 없다 — 내(Zeus)가 자연어에서 종목·수량·[가격]·
   매수/매도를 직접 판단한다.
   - **반드시 1회 재확인 후에만 발주한다**(오너가 명시적으로 정한 절차) — "삼성전자
     10주 매수 접수할까요?"처럼 판단한 내용을 그대로 되물은 뒤, 그 다음 메시지에서
     Frank가 명확히 긍정("응"·"승인"·"ㅇㅇ" 등)해야 실행한다. 모호하거나 다른 주제로
     넘어가면 발주하지 않는다(추정 금지).
   - 긍정 확인 후 `scripts/tools/place-nh-direct-order.mjs --side=매수|매도
     --asset="<종목명 또는 코드>" --quantity=<N> [--price=<지정가>]` 호출. 금현물·
     장내직접채권은 `--price` 필수(시장가 개념 자체가 없음, CLI가 강제 거부). 이
     CLI는 새 주문실행 경로가 아니라 `execute-asset-allocation-proposal.mjs`(부서
     제안 승인 경로와 동일 파이프라인 — order-gate 가격이탈·시장개장·킬스위치
     검문소, 중복발주 가드)를 그대로 태운다.
   - ⚠️ **"시장가"가 아니다** — `--price`를 생략해도 진짜 시장가 주문이 나가는 게
     아니라, 이 CLI가 방금 조회한 현재가를 지정가로 그대로 써서 낸다(NH 주문은
     항상 지정가). 그리고 어느 쪽이든(자동조회 가격이든 Frank가 직접 부른 가격이든)
     검문소의 가격이탈 체크(±1%)를 통과해야 한다 — 즉 **Frank가 "68000원에 사줘"처럼
     현재가(예: 75000원)와 1% 넘게 떨어진 지정가를 명시하면 그 주문은 걸리는 게
     아니라 차단된다**(대기 주문으로 안 걸림, 검문소 차단 알림만 나감). 재확인
     질문 시점에 현재가와 크게 다른 가격을 Frank가 불렀다면 이 사실을 미리 알릴 것.
   - **처리 전 반드시 `~/banana-vault/State/ExecutionMode/ExecutionMode.md`를
     먼저 확인**한다(위 1번과 동일 원칙) — `mode: "실전"`이면 재확인 질문에서 그
     사실을 함께 알린다("체결모드가 실전이라 승인하면 바로 실제 주문이 나갑니다").
   - CLI 종료 후 stdout을 그대로 해석해 결과(제안 생성·체결·검문소 차단·거부 사유)를
     Frank에게 즉시 회신한다 — 이 CLI 자신은 텔레그램을 안 보낸다(킬스위치 CLI 등과
     동일 설계, 내 대화 응답이 곧 확인 채널이라서다).
   - ⚠️ 카이로스(퀀트, KIS)와는 완전히 분리 — 이 명령은 NH PLUG(위탁·금현물)만
     다루고 카이로스의 자동체결(승인 없이 신호로 진입)엔 관여하지 않는다. 다만
     킬스위치(State/KillSwitch)는 두 트랙이 전역 공유하므로(기존 설계), "킬스위치
     온" 상태에서는 이 직접주문도 함께 막힌다.
   - 지원 범위는 부서 제안 승인 경로와 동일(`asset-allocation-instrument-
     router.mjs`) — 위탁 국내·해외주식·금현물·장내직접채권(매수만), ISA·외화RP·
     연금저축·직접채권 매도는 대상 아님(CLI가 이유와 함께 거부한다).
7. **오너 직접 정정/취소 지시(NH 위탁·금현물 전용, 2026-09-21 오너 지시 —
   "정정, 취소주문도 가능하게 구현해줘")**: 위 6번으로 낸(또는 부서 제안 승인으로
   나간) 주문을 Frank가 "현재 건 9,450원으로 정정해줘"·"주문 취소해줘"류로
   지시하는 경우다. 6번과 마찬가지로 정확일치 파서가 없다 — 내가 자연어에서
   원주문번호·정정가격(정정만)·매수매도·계좌를 직접 판단한다(원주문번호를 모르면
   Frank에게 되물어라 — 최근 대화에서 어떤 주문을 말하는지 명확하면 그걸 쓰되,
   모호하면 추정하지 말 것, 6번의 "1회 재확인" 원칙과 동일하게 이것도 실행 전
   재확인 한 턴을 거친다).
   - 확인 후 `scripts/tools/modify-cancel-nh-order.mjs --action=정정|취소
     --order-no=<원주문번호> --account=위탁|금현물 --code=<종목코드>
     --name="<종목명>" --side=매수|매도 [--price=<새 정정가격, 정정만 필수>]`
     호출. 이 CLI도 새 안전장치를 안 만들고 `order-gate.mjs`(킬스위치·가격이탈)를
     재사용한다 — 정정은 신규 주문과 동일한 가격이탈 검사(±1%)를 받고, **취소도
     킬스위치를 똑같이 통과해야 한다**(취소라고 예외 없음 — 이 프로젝트가 실제로
     겪은 사고로 확립된 원칙).
   - CLI 종료 후 stdout을 그대로 해석해 결과를 Frank에게 즉시 회신한다 — 이 CLI도
     자신은 텔레그램을 안 보낸다(위 6번·킬스위치 CLI 등과 동일 설계).
   - ⚠️ 정정 성공 시 옛 주문번호 감시(watch-nh-order-fill.mjs)가 안 죽고 계속 돈다
     — 30분 뒤 타임아웃되면 옛 번호에 대한 "체결 확인 시간 초과" 경고가 실제로
     Frank에게 간다(새 번호에 대한 정상 체결 확인과 별개로 온다). 모순돼 보이는 2건
     알림이 같이 올 수 있다는 걸 정정 접수 회신 때 같이 안내해라.
   - 정정/취소는 NH가 새 주문번호를 발급한다(원 주문번호와 다름) — 성공하면 CLI가
     Vault 제안 레코드를 best-effort로 찾아 갱신하고, 정정이면 새 주문번호로
     체결감시(watch-nh-order-fill.mjs)를 다시 띄운다. Frank에게 회신할 때 새
     주문번호도 함께 알려라(다음에 또 정정/취소하려면 그 번호가 필요할 수 있음).
   - ⚠️ 카이로스(퀀트, KIS)와 완전히 분리, 지원 범위는 6번과 동일(위탁·금현물만).

**발송 메시지 형식(오너 확정, 2026-08-05)**: 부서 보고와 내 판단 코멘트를 **한
